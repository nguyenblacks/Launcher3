name: Build Go Launcher 3 APK

on:
  push:
    branches:
      - main
      - master
      - o-mr1
  pull_request:
    branches:
      - main
      - master
      - o-mr1
  workflow_dispatch:

env:
  # Bypass JDK version check in newer sdkmanager (requires 17+, we use 11)
  SKIP_JDK_VERSION_CHECK: true
  # GitHub runners pre-install the SDK here
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Debug build — runs on every push / PR
  # ────────────────────────────────────────────────────────────────────────────
  build-debug:
    name: 🔨 Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. JDK 11 — works with Gradle 4.x AND sdkmanager 16 (via SKIP_JDK_VERSION_CHECK)
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      # 3. Install required SDK components using the pre-installed sdkmanager
      #    No setup-android action needed — ubuntu-latest has SDK pre-installed.
      - name: Install SDK platform 27 + build-tools 27.0.3
        run: |
          # Accept all licenses non-interactively
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-27" \
            "build-tools;27.0.3" \
            "platform-tools"

      # 4. Bootstrap Gradle 4.10.3 wrapper (not committed — AOSP project)
      #    Gradle 4.10.3 = last stable 4.x, compatible with AGP 3.1.x + JDK 11
      - name: Bootstrap Gradle 4.10.3 wrapper
        run: |
          GRADLE_VERSION=4.10.3
          wget -q "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
               -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle-dist
          export GRADLE_HOME=/tmp/gradle-dist/gradle-${GRADLE_VERSION}
          export PATH=$GRADLE_HOME/bin:$PATH
          gradle wrapper --gradle-version "$GRADLE_VERSION" --distribution-type bin
          chmod +x gradlew

      # 5. Cache Gradle
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      # 6. Build debug APK
      - name: Build debug APK (aosp flavor)
        run: |
          ./gradlew assembleAospDebug \
            --no-daemon \
            --stacktrace \
            -PdisablePreDex=true

      # 7. Locate APK and rename it
      - name: Locate APK
        id: apk_info
        run: |
          APK=$(find build/outputs/apk -name "*.apk" | head -1)
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-8)
          FNAME="GoLauncher3-debug-${SHORT_SHA}.apk"
          cp "$APK" "$FNAME"
          echo "apk_name=$FNAME" >> $GITHUB_OUTPUT
          echo "apk_size=$(du -h $FNAME | cut -f1)" >> $GITHUB_OUTPUT

      # 8. Upload APK artifact
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GoLauncher3-debug-${{ github.run_number }}
          path: ${{ steps.apk_info.outputs.apk_name }}
          retention-days: 30

      # 9. Step summary
      - name: Build summary
        if: always()
        run: |
          echo "## 🚀 Go Launcher 3 Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`$(echo $GITHUB_SHA | cut -c1-8)\` |" >> $GITHUB_STEP_SUMMARY
          echo "| APK | \`${{ steps.apk_info.outputs.apk_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Size | ${{ steps.apk_info.outputs.apk_size }} |" >> $GITHUB_STEP_SUMMARY

  # ────────────────────────────────────────────────────────────────────────────
  # Release — only on version tags (e.g. git tag v3.9.2 && git push --tags)
  # ────────────────────────────────────────────────────────────────────────────
  release:
    name: 🏷️ Release APK
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Install SDK components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-27" \
            "build-tools;27.0.3" \
            "platform-tools"

      - name: Bootstrap Gradle 4.10.3 wrapper
        run: |
          GRADLE_VERSION=4.10.3
          wget -q "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
               -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle-dist
          export GRADLE_HOME=/tmp/gradle-dist/gradle-${GRADLE_VERSION}
          export PATH=$GRADLE_HOME/bin:$PATH
          gradle wrapper --gradle-version "$GRADLE_VERSION" --distribution-type bin
          chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}

      - name: Build release APK
        run: |
          ./gradlew assembleAospRelease \
            --no-daemon \
            --stacktrace \
            -PdisablePreDex=true

      - name: Stage release APK
        id: release_apk
        run: |
          APK=$(find build/outputs/apk -name "*release*.apk" | head -1)
          FNAME="GoLauncher3-${{ github.ref_name }}.apk"
          cp "$APK" "$FNAME"
          echo "apk_path=$FNAME" >> $GITHUB_OUTPUT
          echo "apk_size=$(du -h $FNAME | cut -f1)" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Go Launcher 3 ${{ github.ref_name }}"
          body: |
            ## 🚀 Go Launcher 3 ${{ github.ref_name }}

            ### Installation
            1. Download the APK below
            2. Transfer to your Android device
            3. Enable **"Install from unknown sources"** if prompted
            4. Install and set as default launcher

            > **Requires Android 5.0+ (API 21)**

            *APK size: ${{ steps.release_apk.outputs.apk_size }}*
          files: ${{ steps.release_apk.outputs.apk_path }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
