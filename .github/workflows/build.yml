
name: Build Go Launcher 3 APK

on:
  push:
    branches:
      - main
      - master
      - o-mr1
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
      - o-mr1
  workflow_dispatch:

env:
  # Use a user-writable location. The runner's default /usr/local/lib/android/sdk
  # is root-owned and cannot be modified by the runner user.
  ANDROID_HOME: ${{ github.workspace }}/.android-sdk
  ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17 (for sdkmanager)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install SDK platform 31 + build-tools 31.0.0 into a writable dir
        run: |
          set -euo pipefail

          SYSTEM_SDK=/usr/local/lib/android/sdk
          SDKMANAGER=$SYSTEM_SDK/cmdline-tools/latest/bin/sdkmanager

          mkdir -p "$ANDROID_HOME"

          # Accept licenses (idempotent).
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null 2>&1 || true

          # Install only what we need into the writable SDK root.
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platforms;android-31" \
            "build-tools;31.0.0" \
            "platform-tools"

      - name: Switch to JDK 11 (for Gradle build)
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Bootstrap Gradle 4.10.3 wrapper
        run: |
          GRADLE_VERSION=4.10.3
          wget -q "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
               -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle-dist
          export GRADLE_HOME=/tmp/gradle-dist/gradle-${GRADLE_VERSION}
          export PATH=$GRADLE_HOME/bin:$PATH
          gradle wrapper --gradle-version "$GRADLE_VERSION" --distribution-type bin
          chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build debug APK
        run: |
          ./gradlew assembleAospDebug \
            --no-daemon \
            --stacktrace \
            -PdisablePreDex=true

      - name: Locate APK
        id: apk_info
        run: |
          APK=$(find build/outputs/apk -name "*.apk" | head -1)
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-8)
          FNAME="GoLauncher3-debug-${SHORT_SHA}.apk"
          cp "$APK" "$FNAME"
          echo "apk_name=$FNAME" >> $GITHUB_OUTPUT
          echo "apk_size=$(du -h $FNAME | cut -f1)" >> $GITHUB_OUTPUT

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GoLauncher3-debug-${{ github.run_number }}
          path: ${{ steps.apk_info.outputs.apk_name }}
          retention-days: 30

      - name: Build summary
        if: always()
        run: |
          echo "## Go Launcher 3 Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`$(echo $GITHUB_SHA | cut -c1-8)\` |" >> $GITHUB_STEP_SUMMARY
          echo "| APK | \`${{ steps.apk_info.outputs.apk_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Size | ${{ steps.apk_info.outputs.apk_size }} |" >> $GITHUB_STEP_SUMMARY

  release:
    name: Release APK
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17 (for sdkmanager)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Clean pre-installed SDK platforms
        run: |
          rm -rf $ANDROID_HOME/platforms
          mkdir -p $ANDROID_HOME/platforms

      - name: Install SDK components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-31" \
            "build-tools;31.0.0" \
            "platform-tools"

      - name: Switch to JDK 11 (for Gradle build)
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Bootstrap Gradle 4.10.3 wrapper
        run: |
          GRADLE_VERSION=4.10.3
          wget -q "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
               -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle-dist
          export GRADLE_HOME=/tmp/gradle-dist/gradle-${GRADLE_VERSION}
          export PATH=$GRADLE_HOME/bin:$PATH
          gradle wrapper --gradle-version "$GRADLE_VERSION" --distribution-type bin
          chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-release-${{ hashFiles('**/*.gradle') }}

      - name: Build release APK
        run: |
          ./gradlew assembleAospRelease \
            --no-daemon \
            --stacktrace \
            -PdisablePreDex=true

      - name: Stage release APK
        id: release_apk
        run: |
          APK=$(find build/outputs/apk -name "*release*.apk" | head -1)
          FNAME="GoLauncher3-${{ github.ref_name }}.apk"
          cp "$APK" "$FNAME"
          echo "apk_path=$FNAME" >> $GITHUB_OUTPUT
          echo "apk_size=$(du -h $FNAME | cut -f1)" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Go Launcher 3 ${{ github.ref_name }}"
          body: |
            ## Go Launcher 3 ${{ github.ref_name }}

            ### Installation
            1. Download the APK below
            2. Transfer to your Android device
            3. Enable **"Install from unknown sources"** if prompted
            4. Install and set as default launcher

            > **Requires Android 5.0+ (API 21)**

            *APK size: ${{ steps.release_apk.outputs.apk_size }}*
          files: ${{ steps.release_apk.outputs.apk_path }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
